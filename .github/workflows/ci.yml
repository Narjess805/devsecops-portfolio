name: CI DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio/api/package-lock.json
      - run: npm ci
      - name: Create contacts table
        run: |
          PGPASSWORD=test psql -h localhost -U test -d testdb -c "
          CREATE TABLE IF NOT EXISTS contacts (
            id SERIAL PRIMARY KEY,
            name VARCHAR(100) NOT NULL,
            email VARCHAR(255) NOT NULL,
            message TEXT NOT NULL,
            created_at TIMESTAMP DEFAULT NOW()
          );"
      - run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio/frontend/package-lock.json
      - run: npm ci
      - run: npm test

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Gitleaks (CLI)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --no-banner --redact --verbose
      - name: Semgrep (CLI)
        run: |
          pip install semgrep
          semgrep scan --config p/security-audit --config p/owasp-top-ten --error
      - name: npm audit
        run: |
          cd portfolio/api && npm audit --audit-level=high
          cd ../frontend && npm audit --audit-level=high

  build-sign-scan:
    needs: [api-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # nosemgrep
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: |
          IMAGE_NAME="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/api:${{ github.sha }}"
          docker build -t $IMAGE_NAME portfolio/api
          docker push $IMAGE_NAME

      - name: Build Frontend image
        run: |
          IMAGE_NAME="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/frontend:${{ github.sha }}"
          docker build -t $IMAGE_NAME portfolio/frontend
          docker push $IMAGE_NAME

      - name: Generate SBOM API (Syft)
        uses: anchore/sbom-action@v0 # nosemgrep
        with:
          image: ghcr.io/narjess805/devsecops-portfolio/api:${{ github.sha }}
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Generate SBOM Frontend (Syft)
        uses: anchore/sbom-action@v0 # nosemgrep
        with:
          image: ghcr.io/narjess805/devsecops-portfolio/frontend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4 # nosemgrep
        with:
          name: sbom-artifacts
          path: |
            sbom-api.spdx.json
            sbom-frontend.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3 # nosemgrep

      - name: Sign API image
        run: |
          cosign sign --yes ghcr.io/narjess805/devsecops-portfolio/api:${{ github.sha }}
          cosign sign --yes ghcr.io/narjess805/devsecops-portfolio/frontend:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Install Trivy
        run: |
          wget -qO- https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz | tar -xzv -C /usr/local/bin trivy
      
      - name: Trivy scan API
        run: |
          trivy image --format sarif --output trivy-api.sarif --severity CRITICAL,HIGH --exit-code 0 ghcr.io/narjess805/devsecops-portfolio/api:${{ github.sha }}
      
      - name: Trivy scan Frontend
        run: |
          trivy image --format sarif --output trivy-frontend.sarif --severity CRITICAL,HIGH --exit-code 0 ghcr.io/narjess805/devsecops-portfolio/frontend:${{ github.sha }}
      
      - name: Upload Trivy API results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d
        with:
          sarif_file: 'trivy-api.sarif'
          category: 'trivy-api'
      
      - name: Upload Trivy Frontend results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
