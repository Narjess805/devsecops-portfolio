name: CI DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@60edb5dd545a775178f5252478e37601007fca8c
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio/api/package-lock.json
      - run: npm ci
      - name: Create contacts table
        run: |
          PGPASSWORD=test psql -h localhost -U test -d testdb -c "
          CREATE TABLE IF NOT EXISTS contacts (
            id SERIAL PRIMARY KEY,
            name VARCHAR(100) NOT NULL,
            email VARCHAR(255) NOT NULL,
            message TEXT NOT NULL,
            created_at TIMESTAMP DEFAULT NOW()
          );"
      - run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@60edb5dd545a775178f5252478e37601007fca8c
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portfolio/frontend/package-lock.json
      - run: npm ci
      - run: npm test

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Gitleaks (CLI)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --no-banner --redact --verbose

      - name: Semgrep (CLI)
        run: |
          pip install semgrep
          semgrep scan --config p/security-audit --config p/owasp-top-ten --error

      - name: npm audit
        run: |
          cd portfolio/api && npm audit --audit-level=high
          cd ../frontend && npm audit --audit-level=high

  docker-build-scan:
    needs: [api-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build API image
        run: docker build -t portfolio-api:${{ github.sha }} portfolio/api
      - name: Build Frontend image
        run: docker build -t portfolio-frontend:${{ github.sha }} portfolio/frontend
      - name: Trivy scan API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio-api:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-api.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Trivy scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio-frontend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Upload Trivy API results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-api.sarif'
          category: 'trivy-api'
      - name: Upload Trivy Frontend results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
